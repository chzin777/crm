services:
  integration-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oticas-integration-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    networks:
      - oticas-net
      - ecommerce-net
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='x-api-key: $${API_KEY}' http://localhost:4000/v1/stats || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: oticas-integration-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis/data:/data
    networks:
      - oticas-net

networks:
  oticas-net:
    external: true
    name: crm_crm-network
  ecommerce-net:
    external: true
    name: oticas-site-internal
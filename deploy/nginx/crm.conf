# Proxy do CRM (container crm-proxy, porta 3000 do host; o Cloudflare Tunnel aponta para cá).
# A cor ativa vem de runtime/proxy/active.conf, gravado por scripts/deploy-zero-downtime.sh
# (ex.: set $crm_upstream crm-app-blue:3000;). Troca de cor = nginx -s reload (sem derrubar conexões).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # DNS interno do Docker: o nome da cor é resolvido a cada pedido, então o proxy sobe mesmo com a outra cor parada.
  resolver 127.0.0.11 valid=5s ipv6=off;
  include /etc/nginx/crm-runtime/active.conf;

  # Anexos do chat/campanhas (até 5 x 16 MB) e importação de planilhas.
  client_max_body_size 120m;

  location = /proxy-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://$crm_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Tempo real do chat (SSE) e respostas em streaming: sem buffer e com leitura longa.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 5s;
  }
}
